[project]
name = "ai-clinical-assistant"
version = "0.1.0"
description = "An autonomous clinical assistant powered by large language models (LLMs) and retrieval-augmented generation (RAG), designed to help doctors diagnose patients and suggest treatment plans"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.4",
    "chromadb>=1.0.20",
    "faiss-cpu>=1.12.0",
    "fastapi[standard]>=0.116.1",
    "hf-xet>=1.1.8",
    "httpx>=0.28.1",
    "kaggle>=1.7.4.5",
    "langchain>=0.3.27",
    "nltk>=3.9.1",
    "ollama>=0.5.3",
    "openai>=1.101.0",
    "pandas>=2.3.2",
    "polars>=1.32.3",
    "psycopg>=3.2.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "python-dotenv>=1.1.1",
    "sentence-transformers>=5.1.0",
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.24",
    "streamlit>=1.48.1",
    "transformers>=4.55.4",
    "ucimlrepo>=0.0.7",
]
